<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ONE CLICK Lifeline</title>

  <!-- Three.js CDN for WebGL Caustic Background Shader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg-color: #0a0c10;
      --card-bg: rgba(22, 27, 34, 0.82);
      --border-color: rgba(48, 54, 61, 0.85);
      --text-main: #f0f6fc;
      --text-sub: #8b949e;
      --accent-blue: #38bdf8;
      --alert-red: #f85149;
      --success-green: #2ea043;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* WebGL Canvas Background */
    #caustic-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Main Content Wrapper */
    .app-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* --- SCREEN 1: ONBOARDING SETUP --- */
    #setup-screen {
      display: none;
      width: 100%;
      flex-direction: column;
      gap: 16px;
      max-height: 90vh;
      overflow-y: auto;
      scrollbar-width: none;
    }
    #setup-screen::-webkit-scrollbar { display: none; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 16px;
      padding: 18px;
    }

    h2 { font-size: 1.4rem; margin-bottom: 6px; }
    h3 { font-size: 1rem; color: var(--accent-blue); margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; }
    
    input, textarea, select {
      width: 100%;
      padding: 12px;
      background: rgba(13, 17, 23, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: white;
      font-size: 0.95rem;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent-blue);
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .save-btn {
      background: var(--success-green);
      color: white;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(46, 160, 67, 0.4);
    }

    /* --- SCREEN 2: FIRST-TIME BLOW INTERFACE --- */
    #blow-screen {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    .blow-halo-ring {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.12);
      border: 3px solid var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .gauge-wrapper {
      width: 100%;
      height: 14px;
      background: #21262d;
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      margin-top: 10px;
    }

    .gauge-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-blue), var(--alert-red));
      transition: width 0.08s linear;
    }

    /* --- SCREEN 3: 5-SECOND ACCIDENTAL BUFFER --- */
    #buffer-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 24px;
    }

    .countdown-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 6px solid var(--alert-red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      font-weight: 800;
      color: white;
      background: rgba(248, 81, 73, 0.12);
      box-shadow: 0 0 24px rgba(248, 81, 73, 0.35);
    }

    .cancel-btn {
      background: var(--alert-red);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 20px 48px;
      font-size: 1.3rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(248, 81, 73, 0.45);
    }

    /* --- SCREEN 4: ACTIVE WAITING & RESCUE MODE --- */
    #waiting-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }

    .breathing-halo {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.9) 0%, rgba(56, 189, 248, 0.3) 40%, transparent 70%);
      animation: inhale-exhale 8s infinite ease-in-out;
      margin-bottom: 28px;
      filter: blur(2px);
    }

    @keyframes inhale-exhale {
      0%, 100% { transform: scale(0.8); opacity: 0.35; }
      50% { transform: scale(1.35); opacity: 0.95; }
    }

    .status-text {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .sub-text {
      font-size: 1.1rem;
      color: var(--text-sub);
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Background WebGL Shader Canvas -->
  <canvas id="caustic-canvas"></canvas>

  <div class="app-container">

    <!-- 1. INITIAL SETUP SCREEN -->
    <div id="setup-screen">
      <h2>Emergency Setup</h2>
      <div class="card">
        <label>Patient Full Name</label>
        <input type="text" id="cfg-name" placeholder="e.g., Mr. Wang">

        <label>Pre-registered Full Address</label>
        <textarea id="cfg-address" rows="2" placeholder="Street, Building, Floor, Room #"></textarea>

        <label>Pre-existing Health Issues (For 119/Circle)</label>
        <input type="text" id="cfg-medical" placeholder="e.g., Stroke history, Asthma, Penicillin allergy">
      </div>

      <div class="card">
        <h3>Sensory Preferences</h3>
        <div class="toggle-row">
          <span>Voice Guidance</span>
          <input type="checkbox" id="cfg-voice" checked style="width:auto; margin:0;">
        </div>
        <div class="toggle-row">
          <span>Rhythmic Vibration</span>
          <input type="checkbox" id="cfg-vibe" checked style="width:auto; margin:0;">
        </div>
        <div class="toggle-row">
          <span>Breathing Halo Light</span>
          <input type="checkbox" id="cfg-halo" checked style="width:auto; margin:0;">
        </div>
      </div>

      <button class="save-btn" onclick="saveConfiguration()">Save Profile & Continue</button>
    </div>

    <!-- 2. FIRST-TIME BLOW INTERFACE (ACOUSTIC TRIGGER SCREEN) -->
    <div id="blow-screen">
      <div class="blow-halo-ring" id="mic-halo">💨</div>
      <div>
        <h2 id="blow-title">Blow Sensor Armed</h2>
        <p id="blow-subtitle" style="color: var(--text-sub); margin-top: 6px; font-size: 0.95rem;">
          Blow firmly into the bottom microphone to initiate emergency dispatch.
        </p>
      </div>

      <div class="gauge-wrapper">
        <div class="gauge-bar" id="breath-gauge"></div>
      </div>
    </div>

    <!-- 3. ACCIDENTAL BUFFER SCREEN (5-Second Countdown) -->
    <div id="buffer-screen">
      <div class="countdown-ring" id="countdown-val">5</div>
      <p style="font-size: 1.25rem; font-weight: 600;">Initiating Rescue Dispatch...</p>
      <button class="cancel-btn" onclick="cancelEmergency()">CANCEL (Accident)</button>
    </div>

    <!-- 4. ACTIVE RESCUE & WAITING MODE -->
    <div id="waiting-screen">
      <div class="breathing-halo" id="halo-element"></div>
      <div class="status-text" id="main-status">Notifying Circle...</div>
      <div class="sub-text" id="sub-status">Follow the breathing light. Help is on the way.</div>
    </div>

  </div>

  <script>
    /* =========================================================================
       1. WEBGL WATER CAUSTIC SHADER BACKGROUND
       ========================================================================= */
    const canvas = document.getElementById("caustic-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      uniform float iTime;
      uniform vec2 iResolution;
      uniform vec3 uColor;
      varying vec2 vUv;

      vec2 hash2(vec2 p, float period) {
        p = mod(p, period);
        p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
        return fract(sin(p) * 43758.5453123);
      }

      float causticPattern(vec2 p, float period, float t) {
        vec2 n = floor(p);
        vec2 f = fract(p);
        float F1 = 8.0;
        float F2 = 8.0;
        for (int j = -1; j <= 1; j++) {
          for (int i = -1; i <= 1; i++) {
            vec2 g = vec2(float(i), float(j));
            vec2 o = hash2(n + g, period);
            o = 0.5 + 0.4 * sin(t + 6.2831853 * o);
            vec2 r = g + o - f;
            float d = dot(r, r);
            if (d < F1) {
              F2 = F1;
              F1 = d;
            } else if (d < F2) {
              F2 = d;
            }
          }
        }
        return F2 - F1;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / iResolution.xy;
        float period = 4.0;
        vec2 p = uv * period;
        float t = iTime * 0.9;
        
        float c1 = causticPattern(p, period, t);
        float c2 = causticPattern(p * 5.0, period * 5.0, t * 1.4);
        float c3 = causticPattern(p * 4.0, period * 4.0, t * 0.7);
        
        float caustics = 0.0;
        caustics += (1.0 - c1) * 0.6;
        caustics += (1.0 - c2) * 0.3;
        caustics += (1.0 - c3) * 0.1;
        caustics = pow(caustics, 3.0);
        caustics = smoothstep(0.3, 1.0, caustics) * 1.2;
        
        vec3 color = uColor * caustics;
        color += uColor * vec3(0.5) * pow(caustics, 2.0);
        float alpha = clamp(caustics * 0.85, 0.0, 1.0);
        
        gl_FragColor = vec4(color, alpha);
      }
    `;

    const uniforms = {
      iTime: { value: 0 },
      iResolution: { value: new THREE.Vector2() },
      uColor: { value: new THREE.Color("#38bdf8") }
    };

    const material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: false
    });

    const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(plane);

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setSize(width, height);
      uniforms.iResolution.value.set(width * renderer.getPixelRatio(), height * renderer.getPixelRatio());
    }
    window.addEventListener("resize", resize);
    resize();

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      uniforms.iTime.value = clock.getElapsedTime();
      renderer.render(scene, camera);
    }
    animate();

    /* =========================================================================
       2. SYSTEM LOGIC: SETUP -> TALKING BLOW INTERFACE -> BUFFER -> RESCUE
       ========================================================================= */
    const RELAY_ENDPOINT = "https://your-relay-worker.workers.dev";
    let config = null;
    let countdownTimer = null;
    let countdownCount = 5;

    // Web Audio State
    let audioContext, analyser, microphone, dataArray;
    let breathAccumulator = 0;
    let isBlowActive = false;

    window.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("lifeline_config");
      if (!saved) {
        // First-ever visit: display configuration setup screen
        document.getElementById("setup-screen").style.display = "flex";
      } else {
        config = JSON.parse(saved);
        // Returning visits: launch straight into armed blow detection interface
        launchBlowInterface();
      }
    });

    function saveConfiguration() {
      config = {
        name: document.getElementById("cfg-name").value || "Patient",
        address: document.getElementById("cfg-address").value || "Registered Home Address",
        medical: document.getElementById("cfg-medical").value || "No medical history specified",
        voice: document.getElementById("cfg-voice").checked,
        vibe: document.getElementById("cfg-vibe").checked,
        halo: document.getElementById("cfg-halo").checked
      };
      localStorage.setItem("lifeline_config", JSON.stringify(config));

      document.getElementById("setup-screen").style.display = "none";
      launchBlowInterface();
    }

    async function launchBlowInterface() {
      document.getElementById("blow-screen").style.display = "flex";

      // AI Voice feedback instructs the user immediately
      speakVoice("Setup saved. Microphone sensor is now listening. When you feel unwell, blow firmly into the bottom microphone to trigger rescue.");

      // Initialize microphone stream
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.3;

        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);

        dataArray = new Uint8Array(analyser.frequencyBinCount);
        isBlowActive = true;
        detectBreathAcoustics();
      } catch (err) {
        console.warn("Microphone access prompt required user interaction:", err);
      }
    }

    function detectBreathAcoustics() {
      if (!isBlowActive) return;

      analyser.getByteFrequencyData(dataArray);

      // Inspect low-frequency turbulence bands (breath rushing over microphone capsule)
      let lowFreqEnergy = 0;
      for (let i = 1; i < 12; i++) {
        lowFreqEnergy += dataArray[i];
      }
      let avgLowEnergy = lowFreqEnergy / 11;

      const BREATH_THRESHOLD = 50;
      const HALO = document.getElementById("mic-halo");
      const GAUGE = document.getElementById("breath-gauge");

      if (avgLowEnergy > BREATH_THRESHOLD) {
        breathAccumulator += 3.5;
        HALO.style.transform = `scale(${1 + avgLowEnergy / 180})`;
        HALO.style.boxShadow = `0 0 25px rgba(56, 189, 248, 0.8)`;
      } else {
        breathAccumulator -= 2;
        HALO.style.transform = "scale(1)";
        HALO.style.boxShadow = "none";
      }

      breathAccumulator = Math.max(0, Math.min(100, breathAccumulator));
      GAUGE.style.width = `${breathAccumulator}%`;

      // Trigger condition satisfied: continuous deliberate breath
      if (breathAccumulator >= 100) {
        isBlowActive = false;
        document.getElementById("blow-screen").style.display = "none";
        startBufferCountdown();
        return;
      }

      requestAnimationFrame(detectBreathAcoustics);
    }

    function startBufferCountdown() {
      document.getElementById("buffer-screen").style.display = "flex";
      uniforms.uColor.value.set("#fb923c"); // Shift shader background to urgent amber

      speakVoice("Emergency dispatch triggered. Five seconds to cancel.");

      if (config.vibe && navigator.vibrate) navigator.vibrate(120);

      countdownTimer = setInterval(() => {
        countdownCount--;
        document.getElementById("countdown-val").innerText = countdownCount;

        if (countdownCount <= 0) {
          clearInterval(countdownTimer);
          document.getElementById("buffer-screen").style.display = "none";
          launchActiveRescueMode();
        }
      }, 1000);
    }

    function cancelEmergency() {
      clearInterval(countdownTimer);
      uniforms.uColor.value.set("#38bdf8");
      document.querySelector(".app-container").innerHTML = `
        <div class="card" style="text-align: center;">
          <h2 style="color: var(--accent-blue);">Alert Cancelled</h2>
          <p style="color: var(--text-sub); margin-top: 8px;">Sensor reset. You can safely close or refresh this page.</p>
        </div>
      `;
      speakVoice("Emergency cancelled.");
    }

    function launchActiveRescueMode() {
      document.getElementById("waiting-screen").style.display = "flex";
      uniforms.uColor.value.set("#38bdf8");

      if (!config.halo) {
        document.getElementById("halo-element").style.display = "none";
      }

      speakVoice("Help is on the way. Follow the rhythm and breathe.");
      startVibrationLoop();
      dispatchEmergencyPayload();
    }

    function speakVoice(text) {
      if (!config || !config.voice || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.88;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function startVibrationLoop() {
      if (!config || !config.vibe || !navigator.vibrate) return;
      navigator.vibrate([4000, 4000]);
      setInterval(() => {
        navigator.vibrate([4000, 4000]);
      }, 8000);
    }

    async function dispatchEmergencyPayload() {
      let lat = null, lng = null;

      try {
        const position = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true,
            timeout: 3000
          });
        });
        lat = position.coords.latitude;
        lng = position.coords.longitude;
      } catch (err) {
        console.warn("GPS timeout, falling back to registered address");
      }

      const payload = {
        patientName: config.name,
        address: config.address,
        medicalHistory: config.medical,
        coordinates: lat && lng ? `${lat},${lng}` : null,
        timestamp: new Date().toISOString()
      };

      try {
        await fetch(RELAY_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.warn("Payload dispatch failed:", err);
      }
    }
  </script>
</body>
</html>
