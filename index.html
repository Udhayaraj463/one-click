<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One-Click Lifeline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; overflow: hidden;
            text-align: center; touch-action: manipulation;
        }

        .container { z-index: 10; padding: 24px; width: 100%; max-width: 400px; display: none; }
        h1 { font-size: 1.9rem; font-weight: 600; margin-bottom: 12px; }
        p { font-size: 1.05rem; color: #94a3b8; margin-bottom: 8px; }

        /* Start Button to bypass browser security */
        #startScreen {
            display: flex; flex-direction: column; align-items: center; gap: 20px;
        }
        #btnSimulateTrigger {
            background-color: #dc2626; color: white; border: none; border-radius: 50px;
            padding: 16px 32px; font-size: 1.2rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.4);
        }

        /* Minimalist Bottom Cancel Button */
        #cancelArea {
            position: absolute; bottom: 40px; left: 0; width: 100%; text-align: center; z-index: 20;
        }
        #btnCancel {
            background: transparent; color: #64748b; font-size: 0.95rem; border: none;
            border-bottom: 1px solid #475569; padding-bottom: 4px; cursor: pointer;
        }
        #btnCancel:active { color: #94a3b8; border-color: #94a3b8; }

        #coords {
            font-family: monospace; font-size: 0.95rem; color: #38bdf8;
            margin-top: 10px; background: rgba(15, 23, 42, 0.6); padding: 10px;
            border-radius: 8px; border: 1px solid #1e293b;
        }
        #db-status { font-size: 0.85rem; color: #10b981; margin-top: 6px; }

        .dashboard {
            display: none; flex-direction: column; gap: 10px; margin-top: 24px; text-align: left;
        }
        .card { background: rgba(15, 23, 42, 0.8); border: 1px solid #334155; padding: 16px; border-radius: 12px; font-size: 0.9rem; }
        .card-header { font-weight: bold; margin-bottom: 6px; display: flex; justify-content: space-between;}
        .text-red { color: #f87171; } .text-green { color: #34d399; } .text-slate { color: #cbd5e1; font-size: 0.8rem; }
        
        .btn-action {
            width: 100%; padding: 10px; margin-top: 10px; background-color: #1e293b;
            color: white; border: 1px solid #475569; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .btn-primary { background-color: #4f46e5; border-color: #4f46e5; }
        #toggleEnv {
            margin-top: 20px; background: transparent; color: #818cf8;
            border: 1px solid #818cf8; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Landing Screen -->
    <div id="startScreen">
        <p style="color:#64748b; font-size:0.9rem;">Web Prototype Simulator</p>
        <button id="btnSimulateTrigger">Simulate Hardware Button Press</button>
    </div>

    <!-- Main Alert Container -->
    <div class="container" id="mainAlert">
        <h1 id="status-title">Trigger Detected</h1>
        <p id="status-sub">Preparing to dispatch...</p>
        
        <div id="coords" style="display:none;">Acquiring live location...</div>
        <div id="db-status" style="display:none;"></div>
        <button id="toggleEnv" style="display:none;">Current Mode: Outside (Live GPS)</button>

        <div class="dashboard" id="dispatchDashboard">
            <div class="card">
                <div class="card-header"><span class="text-red">119 Twilio Voice Proxy</span> <span id="twilio-status" class="text-slate">Calling...</span></div>
                <div id="twilio-log" class="text-slate" style="font-family: monospace;">Dispatching...</div>
            </div>
            <div class="card">
                <div class="card-header"><span class="text-green">LINE Family Group</span> <span class="text-slate">Alert Sent</span></div>
                <div class="text-slate">119 is notified. Coordinate below:</div>
                <button id="btnHeadingOver" class="btn-action btn-primary">我正在前往 (I am heading over)</button>
            </div>
        </div>
    </div>

    <!-- Cancel Option -->
    <div id="cancelArea" style="display:none;">
        <button id="btnCancel">誤觸取消 Cancel (<span id="cancelTimer">5</span>s)</button>
    </div>

    <script>
        const FIREBASE_ENDPOINT = "https://YOUR_FIREBASE_DATABASE_URL/latest_location.json";
        const FALLBACK_LAT = 25.042309;
        const FALLBACK_LNG = 121.5684554;
        
        let isHome = false; 
        let countdown = 5;
        let cancelInterval;
        let hapticInterval;
        let isCancelled = false;

        // START BUTTON Logic
        document.getElementById("btnSimulateTrigger").addEventListener("click", () => {
            document.getElementById("startScreen").style.display = "none";
            document.getElementById("mainAlert").style.display = "block";
            document.getElementById("cancelArea").style.display = "block";
            initiateWarningPhase();
        });

        function startWarningHaptics() {
            if ("vibrate" in navigator) {
                // Short buzz pulses
                navigator.vibrate([300, 300]); 
                hapticInterval = setInterval(() => {
                    navigator.vibrate([300, 300]);
                }, 600);
            }
        }

        function stopHaptics() {
            if ("vibrate" in navigator) {
                navigator.vibrate(0);
            }
            clearInterval(hapticInterval);
        }

        function initiateWarningPhase() {
            startWarningHaptics();
            const timerElem = document.getElementById("cancelTimer");
            
            cancelInterval = setInterval(() => {
                countdown--;
                timerElem.innerText = countdown;
                
                if (countdown <= 0) {
                    clearInterval(cancelInterval);
                    if (!isCancelled) executeDispatch();
                }
            }, 1000);
        }

        document.getElementById("btnCancel").addEventListener("click", () => {
            isCancelled = true;
            clearInterval(cancelInterval);
            stopHaptics();
            
            document.getElementById("status-title").innerText = "Alert Cancelled";
            document.getElementById("status-title").style.color = "#64748b"; 
            document.getElementById("status-sub").innerText = "No emergency calls were made.";
            document.getElementById("cancelArea").style.display = "none";
        });

        function executeDispatch() {
            stopHaptics();

            document.getElementById("cancelArea").style.display = "none";
            document.getElementById("status-title").innerText = "Dispatch Active";
            document.getElementById("status-title").style.color = "#f87171"; 
            document.getElementById("status-sub").innerText = "Help is on the way. Follow the rhythm and breathe.";
            
            document.getElementById("coords").style.display = "block";
            document.getElementById("db-status").style.display = "block";
            document.getElementById("toggleEnv").style.display = "inline-block";
            document.getElementById("dispatchDashboard").style.display = "flex";

            speakGroundingAnd119();
            trackLocation();
        }

        function speakGroundingAnd119() {
            if ('speechSynthesis' in window) {
                const twilioPayload = isHome 
                    ? "119緊急報案。患者為聽語障人士。位置：台北市信義區和平東路三段 18 號 4 樓之 2。一樓大門密碼是 井號 5821。"
                    : "119緊急報案。患者為聽語障人士。目前在戶外，請根據 GPS 座標派車。";
                
                const twilioMsg = new SpeechSynthesisUtterance(twilioPayload);
                twilioMsg.lang = 'zh-TW';
                window.speechSynthesis.speak(twilioMsg);

                document.getElementById('twilio-status').innerText = "Speaking to Operator";
                document.getElementById('twilio-log').innerText = twilioPayload;
            }
        }

        async function syncToDatabase(lat, lng, accuracy, source) {
            const dbStatusElem = document.getElementById("db-status");
            const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
            const payload = {
                status: "ACTIVE_ALERT",
                coordinates: { latitude: lat, longitude: lng, accuracyMeters: accuracy, source: source },
                tacticalContext: isHome ? { locationType: "INDOOR", floor: "4", gateAccessCode: "#5821" } : { locationType: "OUTDOOR" }
            };
            try {
                const response = await fetch(FIREBASE_ENDPOINT, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                if (response.ok) dbStatusElem.innerText = "Cloud Sync: Updated";
                else dbStatusElem.innerText = "Cloud Sync: Error";
            } catch (err) { dbStatusElem.innerText = "Cloud Sync: Offline"; }
        }

        function trackLocation() {
            const coordsElem = document.getElementById("coords");
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        const lat = pos.coords.latitude; const lng = pos.coords.longitude; const acc = Math.round(pos.coords.accuracy);
                        if(isHome) {
                            coordsElem.innerHTML = `Home Detected<br><span style="color:#fcd34d">Floor 4 | Gate Code: #5821</span>`;
                            syncToDatabase(lat, lng, acc, "Pre-saved Home Profile");
                        } else {
                            coordsElem.innerText = `Live GPS: ${lat.toFixed(5)}, ${lng.toFixed(5)} (±${acc}m)`;
                            syncToDatabase(lat, lng, acc, "Live Outdoor GPS");
                        }
                    },
                    (err) => {
                        coordsElem.innerText = "GPS unavailable, using fallback.";
                    },
                    { enableHighAccuracy: true, maximumAge: 0 }
                );
            } else { coordsElem.innerText = "Geolocation not supported."; }
        }

        document.getElementById("toggleEnv").addEventListener("click", (e) => {
            isHome = !isHome;
            e.target.innerText = isHome ? "Current Mode: Home (Gate Code)" : "Current Mode: Outside (Live GPS)";
            trackLocation(); speakGroundingAnd119();
        });

        document.getElementById("btnHeadingOver").addEventListener("click", (e) => {
            e.target.innerText = "✅ 已通知群組 (Group Notified)";
            e.target.style.backgroundColor = "#059669"; e.target.style.borderColor = "#059669"; e.target.disabled = true;
        });
    </script>
</body>
</html>
