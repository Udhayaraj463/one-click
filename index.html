<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One-Click Lifeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            touch-action: manipulation;
        }

        #breathing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #0284c7 0%, #000000 75%);
            opacity: 0.15;
            animation: breathe 8s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes breathe {
            0%, 100% {
                transform: scale(0.8);
                opacity: 0.15;
            }
            50% {
                transform: scale(1.4);
                opacity: 0.85;
            }
        }

        .container {
            z-index: 10;
            padding: 24px;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 1.05rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        #coords {
            font-family: monospace;
            font-size: 0.95rem;
            color: #38bdf8;
            margin-top: 10px;
        }

        #db-status {
            font-size: 0.85rem;
            color: #10b981;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div id="breathing-canvas"></div>

    <div class="container">
        <h1 id="status-title">Alert Activated</h1>
        <p id="status-sub">Help is on the way. Follow the rhythm and breathe.</p>
        <div id="coords">Acquiring live location...</div>
        <div id="db-status"></div>
    </div>

    <script>
        // REPLACE WITH YOUR FIREBASE REALTIME DATABASE URL (keep the trailing /latest_location.json)
        const FIREBASE_ENDPOINT = "https://YOUR_FIREBASE_DATABASE_URL/latest_location.json";
        const FALLBACK_LAT = 25.042309;
        const FALLBACK_LNG = 121.5684554;

        function speakGrounding() {
            if ('speechSynthesis' in window) {
                const message = new SpeechSynthesisUtterance("Help is on the way. Follow the rhythm and breathe.");
                message.rate = 0.85;
                message.pitch = 0.9;
                window.speechSynthesis.speak(message);
            }
        }

        function startHaptics() {
            if ("vibrate" in navigator) {
                navigator.vibrate([4000, 1000, 4000, 1000]);
                setInterval(() => {
                    navigator.vibrate([4000, 1000, 4000, 1000]);
                }, 10000);
            }
        }

        // Send and overwrite latest coordinates in the database
        async function syncToDatabase(lat, lng, accuracy, source) {
            const dbStatusElem = document.getElementById("db-status");
            const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

            const payload = {
                status: "ACTIVE_ALERT",
                lastUpdated: new Date().toISOString(),
                coordinates: {
                    latitude: lat,
                    longitude: lng,
                    accuracyMeters: accuracy,
                    source: source
                },
                directionsUrl: navUrl
            };

            try {
                const response = await fetch(FIREBASE_ENDPOINT, {
                    method: "PUT", // PUT overwrites the single record permanently
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    dbStatusElem.innerText = "Cloud Sync: Updated";
                } else {
                    dbStatusElem.innerText = "Cloud Sync: Error";
                }
            } catch (err) {
                console.warn("Database sync failed:", err);
                dbStatusElem.innerText = "Cloud Sync: Offline";
            }
        }

        function trackLocation() {
            const coordsElem = document.getElementById("coords");

            if ("geolocation" in navigator) {
                // watchPosition triggers continuously as your phone gets better accuracy or moves
                navigator.geolocation.watchPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        const acc = Math.round(pos.coords.accuracy);

                        coordsElem.innerText = `GPS: ${lat.toFixed(5)}, ${lng.toFixed(5)} (±${acc}m)`;
                        syncToDatabase(lat, lng, acc, "Live GPS");
                    },
                    (err) => {
                        console.warn("GPS Warning:", err.message);
                        coordsElem.innerText = "GPS unavailable, using fallback.";
                        syncToDatabase(FALLBACK_LAT, FALLBACK_LNG, 50, "Default Base Location");
                    },
                    { enableHighAccuracy: true, maximumAge: 0 }
                );
            } else {
                coordsElem.innerText = "Geolocation not supported, using fallback.";
                syncToDatabase(FALLBACK_LAT, FALLBACK_LNG, 50, "Default Base Location");
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            speakGrounding();
            startHaptics();
            trackLocation();
        });
    </script>
</body>
</html>
