<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Breath Activation Trigger</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #f0f6fc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow: hidden;
    }

    .blow-card {
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid #30363d;
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .mic-icon-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.1);
      border: 3px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      position: relative;
    }

    /* Gauge bar for breath threshold */
    .progress-bar-container {
      width: 100%;
      height: 14px;
      background: #21262d;
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid #30363d;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #f85149);
      transition: width 0.08s linear;
    }

    h2 { font-size: 1.5rem; font-weight: 700; }
    p { font-size: 0.95rem; color: #8b949e; line-height: 1.4; }

    .arm-btn {
      background: #238636;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .alert-fired {
      display: none;
      font-size: 1.5rem;
      color: #f85149;
      font-weight: 800;
      animation: flash 1s infinite alternate;
    }

    @keyframes flash {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="blow-card" id="card">
    <div class="mic-icon-circle" id="mic-halo">💨</div>

    <div>
      <h2 id="title">Blow into Mic</h2>
      <p id="desc">Hold a continuous breath into the bottom microphone to trigger rescue.</p>
    </div>

    <!-- Breath Gauge -->
    <div class="progress-bar-container">
      <div class="progress-bar" id="gauge"></div>
    </div>

    <!-- Mobile browsers require one tap to grant microphone permissions -->
    <button class="arm-btn" id="arm-button" onclick="initMicDetection()">Enable Breath Sensor</button>
    <div class="alert-fired" id="alert-msg">🚨 EMERGENCY TRIGGERED</div>
  </div>

  <script>
    let audioContext, analyser, microphone, dataArray;
    let breathAccumulator = 0; // Tracks breath duration
    const GAUGE = document.getElementById("gauge");
    const HALO = document.getElementById("mic-halo");
    const ALERT_MSG = document.getElementById("alert-msg");
    const ARM_BTN = document.getElementById("arm-button");

    async function initMicDetection() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        ARM_BTN.style.display = "none";
        document.getElementById("desc").innerText = "Sensor Active: Blow firmly at the bottom mic.";

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.3;

        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);

        dataArray = new Uint8Array(analyser.frequencyBinCount);
        detectBreathLoop();
      } catch (err) {
        alert("Microphone access is required for breath activation: " + err.message);
      }
    }

    function detectBreathLoop() {
      analyser.getByteFrequencyData(dataArray);

      // Low frequency rumble check (wind/breath turbulence hits frequencies below index 12)
      let lowFreqEnergy = 0;
      for (let i = 1; i < 12; i++) {
        lowFreqEnergy += dataArray[i];
      }
      let avgLowEnergy = lowFreqEnergy / 11;

      // Threshold: Normal room noise is ~10-25. Direct breath turbulence easily exceeds 55
      const BREATH_THRESHOLD = 50;

      if (avgLowEnergy > BREATH_THRESHOLD) {
        breathAccumulator += 3.5; // Fill the gauge rapidly while blowing
        HALO.style.transform = `scale(${1 + avgLowEnergy / 180})`;
        HALO.style.boxShadow = `0 0 25px rgba(56, 189, 248, 0.8)`;
      } else {
        breathAccumulator -= 2; // Deplete gauge when breath stops
        HALO.style.transform = "scale(1)";
        HALO.style.boxShadow = "none";
      }

      // Clamp between 0% and 100%
      breathAccumulator = Math.max(0, Math.min(100, breathAccumulator));
      GAUGE.style.width = `${breathAccumulator}%`;

      if (breathAccumulator >= 100) {
        fireEmergencyTrigger();
        return;
      }

      requestAnimationFrame(detectBreathLoop);
    }

    function fireEmergencyTrigger() {
      // Vibrate phone upon confirmed trigger
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

      document.getElementById("title").style.display = "none";
      document.getElementById("desc").style.display = "none";
      document.querySelector(".progress-bar-container").style.display = "none";
      HALO.innerText = "🚨";
      HALO.style.borderColor = "#f85149";
      ALERT_MSG.style.display = "block";

      console.log("Acoustic breath criteria satisfied: Starting 5-second buffer and relay dispatch.");
      // This is where your startBufferCountdown() or dispatch logic executes
    }
  </script>
</body>
</html>
