<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One-Click Lifeline Prototype</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* The Webpage Background (Behind the phone) */
        body {
            background-color: #f1f5f9; /* Light gray background to make the phone pop */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* The Physical Phone Frame UI */
        .phone {
            width: 400px;
            height: 820px;
            background: #0F172A; /* Dark phone bezel */
            border-radius: 52px;
            padding: 12px;
            box-shadow: 0 30px 60px -20px rgba(15,23,42,0.4);
            position: relative;
        }

        /* The Actual Screen of the Phone */
        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000; /* Your dark theme */
            color: #ffffff;
            border-radius: 42px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Your Breathing Background (Confined to the phone screen) */
        #breathing-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #0284c7 0%, #000000 75%);
            opacity: 0.15; animation: breathe 8s infinite ease-in-out; pointer-events: none;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(0.8); opacity: 0.15; }
            50% { transform: scale(1.4); opacity: 0.85; }
        }

        /* Your Language Selection Screen */
        #langScreen {
            z-index: 50; display: flex; flex-direction: column; gap: 20px; width: 100%; padding: 0 40px;
        }
        .lang-btn {
            background-color: transparent; color: #cbd5e1; border: 1px solid #475569;
            border-radius: 12px; padding: 16px 0; font-size: 1.2rem; cursor: pointer;
            transition: background-color 0.2s, color 0.2s; width: 100%; font-weight: bold;
        }
        .lang-btn:active { background-color: #334155; color: white; }

        /* Your Main App Interface */
        .container { z-index: 10; padding: 24px; width: 100%; display: none; }
        h1 { font-size: 1.9rem; font-weight: 600; margin-bottom: 12px; }
        p { font-size: 1.05rem; color: #94a3b8; margin-bottom: 8px; }

        #cancelArea { position: absolute; bottom: 40px; left: 0; width: 100%; text-align: center; z-index: 20; display: none; }
        #btnCancel { background: transparent; color: #64748b; font-size: 0.95rem; border: none; border-bottom: 1px solid #475569; padding-bottom: 4px; cursor: pointer; }
        #btnCancel:active { color: #94a3b8; border-color: #94a3b8; }

        #coords {
            font-family: monospace; font-size: 0.95rem; color: #38bdf8;
            margin-top: 10px; background: rgba(15, 23, 42, 0.6); padding: 10px;
            border-radius: 8px; border: 1px solid #1e293b;
        }
        #db-status { font-size: 0.85rem; color: #10b981; margin-top: 6px; }

        /* Your Dashboard Cards */
        .dashboard { display: none; flex-direction: column; gap: 10px; margin-top: 24px; text-align: left; }
        .card { background: rgba(15, 23, 42, 0.8); border: 1px solid #334155; padding: 16px; border-radius: 12px; font-size: 0.9rem; }
        .card-header { font-weight: bold; margin-bottom: 6px; display: flex; justify-content: space-between;}
        .text-red { color: #f87171; } .text-green { color: #34d399; } .text-slate { color: #cbd5e1; font-size: 0.8rem; }
        
        .btn-action { width: 100%; padding: 12px; margin-top: 10px; background-color: #1e293b; color: white; border: 1px solid #475569; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-primary { background-color: #4f46e5; border-color: #4f46e5; }
        
        #toggleEnv { margin-top: 20px; background: transparent; color: #818cf8; border: 1px solid #818cf8; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }

        /* Responsive scaling for smaller monitors */
        @media (max-height: 850px) {
            .phone { transform: scale(0.85); margin-top: -50px; }
        }
    </style>
</head>
<body>

    <!-- The UI Phone Shell -->
    <div class="phone">
        <div class="screen">
            
            <div id="breathing-canvas"></div>

            <!-- 1. Language Selection Screen -->
            <div id="langScreen">
                <button class="lang-btn" onclick="selectLanguage('en')">English</button>
                <button class="lang-btn" onclick="selectLanguage('zh')">繁體中文</button>
            </div>
            
            <!-- 2. Main Alert Container -->
            <div class="container" id="mainAlert">
                <h1 id="status-title"></h1>
                <p id="status-sub"></p>
                
                <div id="coords" style="display:none;"></div>
                <div id="db-status" style="display:none;"></div>
                <button id="toggleEnv" style="display:none;"></button>

                <div class="dashboard" id="dispatchDashboard">
                    <div class="card">
                        <div class="card-header"><span class="text-red" id="ui-twilio-header"></span> <span id="twilio-status" class="text-slate"></span></div>
                        <div id="twilio-log" class="text-slate" style="font-family: monospace;"></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><span class="text-green" id="ui-line-header"></span> <span class="text-slate" id="ui-line-status"></span></div>
                        <div class="text-slate" id="ui-line-sub"></div>
                        <button id="btnHeadingOver" class="btn-action btn-primary"></button>
                    </div>
                </div>
            </div>

            <!-- Cancel Option -->
            <div id="cancelArea">
                <button id="btnCancel"><span id="ui-cancel-text"></span><span id="cancelTimer">5</span><span id="ui-cancel-end"></span></button>
            </div>

        </div>
    </div>

    <!-- Your Exact JavaScript Logic -->
    <script>
        const i18n = {
            en: {
                titleTrigger: "Trigger Detected", subTrigger: "Preparing to dispatch...",
                cancelBtn: "Cancel (", cancelEnd: "s)",
                titleCancel: "Alert Cancelled", subCancel: "No emergency calls were made.",
                titleActive: "Dispatch Active", subActive: "Help is on the way. Follow the rhythm and breathe.",
                twilioHeader: "119 Twilio Voice Proxy", twilioCalling: "Calling...",
                twilioSpeaking: "Speaking to Operator", twilioDispatching: "Dispatching...",
                lineHeader: "LINE Family Group", lineSent: "Alert Sent",
                lineSub: "119 is notified. Coordinate below:",
                btnHeading: "I am heading over", btnHeadingDone: "✅ Group Notified",
                gpsAcquiring: "Acquiring live location...", gpsFallback: "GPS unavailable, using fallback.", gpsUnsupported: "Geolocation not supported.",
                cloudUpdated: "Cloud Sync: Updated",
                modeOutside: "Current Mode: Outside (Live GPS)", modeHome: "Current Mode: Home (Gate Code)",
                homeFormat: "Home Detected<br><span style='color:#fcd34d'>Floor 4 | Gate Code: #5821</span>",
                voiceUser: "Help is on the way. Follow the rhythm and breathe.",
                voiceTwilioHome: "Emergency 119. Patient is hearing and speech impaired. Location: 4th Floor, Number 18, Section 3, Heping East Road, Xinyi District, Taipei City. Ground floor gate code is hash 5 8 2 1.",
                voiceTwilioOutside: "Emergency 119. Patient is hearing and speech impaired. Currently outdoors. Please dispatch ambulance based on live GPS coordinates.",
                langCode: "en-US"
            },
            zh: {
                titleTrigger: "已偵測到觸發", subTrigger: "準備通報...",
                cancelBtn: "誤觸取消 (", cancelEnd: "秒)",
                titleCancel: "警報已取消", subCancel: "未撥打任何緊急電話。",
                titleActive: "救援通報中", subActive: "救援已在路上。請跟隨節奏深呼吸。",
                twilioHeader: "119 Twilio 語音代答", twilioCalling: "撥號中...",
                twilioSpeaking: "正在與接線員對話", twilioDispatching: "發送中...",
                lineHeader: "LINE 親友群組", lineSent: "警報已發送",
                lineSub: "已同步通知 119。請在下方協調：",
                btnHeading: "我正在前往", btnHeadingDone: "✅ 已通知群組",
                gpsAcquiring: "正在獲取即時定位...", gpsFallback: "無法使用 GPS，使用備用定位。", gpsUnsupported: "不支援地理定位。",
                cloudUpdated: "雲端同步：已更新",
                modeOutside: "當前模式：戶外 (即時 GPS)", modeHome: "當前模式：居家 (大門密碼)",
                homeFormat: "偵測到居家環境<br><span style='color:#fcd34d'>4 樓 | 大門密碼：#5821</span>",
                voiceUser: "救援已在路上。請跟隨節奏深呼吸。",
                voiceTwilioHome: "119緊急報案。患者為聽語障人士。位置：台北市信義區和平東路三段 18 號 4 樓之 2。一樓大門密碼是 井號 5821。",
                voiceTwilioOutside: "119緊急報案。患者為聽語障人士。目前在戶外，請根據 GPS 座標派車。",
                langCode: "zh-TW"
            }
        };

        let sysLang = 'en'; 
        let isHome = false; 
        let countdown = 5;
        let cancelInterval;
        let hapticInterval;
        let isCancelled = false;
        let headingOverClicked = false;

        function selectLanguage(lang) {
            sysLang = lang;
            const t = i18n[sysLang];

            document.getElementById("status-title").innerText = t.titleTrigger;
            document.getElementById("status-sub").innerText = t.subTrigger;
            document.getElementById("ui-cancel-text").innerText = t.cancelBtn;
            document.getElementById("ui-cancel-end").innerText = t.cancelEnd;
            document.getElementById("ui-twilio-header").innerText = t.twilioHeader;
            document.getElementById("twilio-status").innerText = t.twilioCalling;
            document.getElementById("twilio-log").innerText = t.twilioDispatching;
            document.getElementById("ui-line-header").innerText = t.lineHeader;
            document.getElementById("ui-line-status").innerText = t.lineSent;
            document.getElementById("ui-line-sub").innerText = t.lineSub;
            document.getElementById("btnHeadingOver").innerText = t.btnHeading;
            document.getElementById("coords").innerText = t.gpsAcquiring;
            document.getElementById("toggleEnv").innerText = t.modeOutside;

            document.getElementById("langScreen").style.display = "none";
            document.getElementById("mainAlert").style.display = "block";
            document.getElementById("cancelArea").style.display = "block";

            initiateWarningPhase();
        }

        function startWarningHaptics() {
            if ("vibrate" in navigator) {
                navigator.vibrate([300, 300]); 
                hapticInterval = setInterval(() => { navigator.vibrate([300, 300]); }, 600);
            }
        }

        function stopHaptics() {
            if ("vibrate" in navigator) navigator.vibrate(0);
            clearInterval(hapticInterval);
        }

        function initiateWarningPhase() {
            startWarningHaptics();
            const timerElem = document.getElementById("cancelTimer");
            
            cancelInterval = setInterval(() => {
                countdown--;
                timerElem.innerText = countdown;
                
                if (countdown <= 0) {
                    clearInterval(cancelInterval);
                    if (!isCancelled) executeDispatch();
                }
            }, 1000);
        }

        document.getElementById("btnCancel").addEventListener("click", () => {
            isCancelled = true;
            clearInterval(cancelInterval);
            stopHaptics();
            
            const t = i18n[sysLang];
            document.getElementById("status-title").innerText = t.titleCancel;
            document.getElementById("status-title").style.color = "#64748b"; 
            document.getElementById("status-sub").innerText = t.subCancel;
            document.getElementById("cancelArea").style.display = "none";
        });

        function executeDispatch() {
            stopHaptics();
            const t = i18n[sysLang];

            document.getElementById("cancelArea").style.display = "none";
            document.getElementById("status-title").innerText = t.titleActive;
            document.getElementById("status-title").style.color = "#f87171"; 
            document.getElementById("status-sub").innerText = t.subActive;
            
            document.getElementById("coords").style.display = "block";
            document.getElementById("db-status").style.display = "block";
            document.getElementById("toggleEnv").style.display = "inline-block";
            document.getElementById("dispatchDashboard").style.display = "flex";

            speakGroundingAnd119();
            trackLocation();
        }

        function speakGroundingAnd119() {
            const t
